[project]
name = "bsky-cli"
version = "0.1.0"
description = "Bluesky CLI - Publica en Bluesky desde la terminal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "atproto>=0.0.65",
    "beautifulsoup4>=4.14.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.scripts]
bsky = "bsky.cli:main"
